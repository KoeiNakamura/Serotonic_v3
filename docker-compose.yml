version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: serotonic_db
    platform: linux/amd64
    environment:
      MYSQL_DATABASE: serotonic
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: serotonic_backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      MYSQL_DATABASE: serotonic
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: serotonic_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules   # ← 追加：ホスト側で上書きされないようにする
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true

volumes:
  db_data: